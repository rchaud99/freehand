# Historical: the objective / informed / stateless pilots and informed_models (seed 10: the first seed from 10 up on
# which the oracle reaches every target of all three rules without clamping).
id: legacy-objective-v0
version: 0
legacy: true
description: >
  The learning-curve page: 20 smaller squares visited in far-apart order (each as far as possible from the previous
  one), a silent change after square 4, so the first-try curve over squares 5-20 measures transfer of a learned rule.
track: plotter
generator: freehand-page-v1
page:
  n_squares: 20
  area: default
  size_range_mm: [16.0, 28.0]
  gap_mm: 7.0
  order: far_apart
change:
  schedule: fixed
  after_square: 4
episode:
  cap_strokes: 12
  cap_turns: 14
perturbations:
  rot13:   {type: L2_rotation, params: {degrees: 13.0}, step: 1}
  L3shear: {type: L3_affine, params: {sx: 1.12, sy: 0.90, shear_deg: 7.0}, step: 2}
  L6cam:   {type: L6_attribution, params: {camera_shift_mm: 5.0, camera_rot_deg: 2.0, plotter_offset_mm: 6.0, variant: cam}, step: 1}
seeds:
  dev: [10]
  test: []
