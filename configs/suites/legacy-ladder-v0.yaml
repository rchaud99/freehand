# Historical: the difficulty ladder (levels 3-7, three rungs each; every cell ran on seed 10) plus level 2.
id: legacy-ladder-v0
version: 0
legacy: true
description: >
  The benchmark-ladder page: 8 squares on the calibrated view, a silent change after square 4. Rungs are the
  historical levels.KNOBS; names are the historical condition names (L3_k1 ... L7_k3, L6cam/plot/both).
track: plotter
generator: freehand-page-v1
page:
  n_squares: 8
  area: default
  size_range_mm: [20.0, 40.0]
  gap_mm: 9.0
  order: placement
change:
