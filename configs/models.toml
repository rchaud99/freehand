# Freehand model registry.
#
# One [models.<short id>] table per model. Fields:
#   slug          OpenRouter model slug (for api = "google-genai": the Gemini API model name)
#   display       human name for reports
#   api           "openrouter" (default) | "google-genai" (historical direct-Gemini route) | "fake" (tests)
#   provider      OpenRouter provider to pin (no fallbacks); omit for OpenRouter's automatic routing
#   reasoning     the OpenRouter `reasoning` object. Reasoning is FORCED ON for every model: a token budget for
#                 Anthropic models (effort=medium gave Sonnet 0 reasoning tokens), effort=high otherwise.
#   max_tokens    output cap per call (reasoning included)
#   price_in / price_out   list price, USD per million tokens (used for budget reservations and as the cost when a
#                 provider does not report one); checked against the OpenRouter models API on `added`/`price_date`
#   output_mode   default answer mode: "page_mm" (read the grid, answer in page mm), "crop_px" (answer in pixels of
#                 a 12 px/mm crop; converted in code) or "auto" (decide per run with the K1 gate: page_mm if a
#                 4-square no-change check closes >= 2 squares first try, else crop_px)
#   settings      api-specific extra settings (google-genai: thinking_level, media_resolution)
#   added, notes  provenance
#
# Experiments may override reasoning / max_tokens / provider / output_mode per model (configs/experiments/*.yaml),
# which is how the historical pilots' exact settings are reproduced.
#
# Any OpenRouter slug that is not registered here still works (`freehand episode --model vendor/model`): it gets the
# [defaults] below plus prices looked up from the OpenRouter models API (or conservative placeholders offline), and a
# warning.

[defaults]
api = "openrouter"
reasoning = { effort = "high" }
max_tokens = 8000
output_mode = "page_mm"
# Conservative placeholder prices for unregistered models when the models API cannot be reached.
price_in = 15.0
price_out = 75.0

