name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # pyproject: requires-python >=3.12,<3.13 (the golden hashes were made on 3.12)
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Test
        # Offline: no API key, no network. The golden image hashes were recorded on macOS arm64; the first Linux
        # run shows whether they hold there.
        run: pytest
