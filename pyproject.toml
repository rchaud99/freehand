[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freehand"
version = "0.1.0"
description = "Freehand: a benchmark for learning a silently changed tool from the consequences of one's own strokes."
readme = "README.md"
# Pinned: the golden page/image hashes and the historical replays were produced with CPython 3.12.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Raghav Chaudhary" }]
# No `license` yet: not chosen (see the README).
keywords = ["benchmark", "llm", "multimodal", "agents", "evaluation", "adaptation", "tool-use", "vision",
            "simulation", "plotter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Private :: Do Not Upload",   # only `pip install -e .` from a clone is supported (see Install in the README)
]
# numpy and opencv are pinned exactly: rendered images (and so request-cache keys) are byte-identical only
# with these versions. Everything else is pinned in requirements.lock.
dependencies = [
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-requests", "types-jsonschema"]
# Only needed to replay/extend the historical direct-Gemini route (`flash-genai`); new runs use OpenRouter.
genai = ["google-genai>=2.0"]

[project.scripts]
freehand = "freehand.cli:main"

# Placeholders: fill in once the public repository exists, then uncomment.
# [project.urls]
# Homepage = "https://github.com/<owner>/freehand"
# Repository = "https://github.com/<owner>/freehand"
# Issues = "https://github.com/<owner>/freehand/issues"
# Data = "https://github.com/<owner>/freehand/releases/tag/v1.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freehand = [
    "sim/assets/*.json",
    "agents/prompts/**/*.txt",
    "results/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "legacy: needs the historical source folders (skipped when absent)",
]

[tool.mypy]
# Baseline: clean (0 errors) under this config; CI keeps it that way. Untyped function bodies are not checked.
python_version = "3.12"
files = ["src/freehand"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["google", "google.*"]          # the optional `genai` extra
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E741",   # `l`/`I` names appear in ported numerical code
    "RUF001", # the prompts deliberately contain typographic characters (degree signs, dashes)
    "RUF002",
    "RUF003",
    "SIM108",
    "RUF005", # false positives on numpy arrays (`array + [dx, dy]` is addition, not concatenation)
    "RUF007",
    "RUF046", # int(round(x)) is needed: round() of a numpy float returns a numpy float
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/parity/record_legacy.py" = ["E501"]   # embeds the legacy-side worker script verbatim
