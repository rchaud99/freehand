[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freehand"
version = "0.1.0"
description = "Freehand: a benchmark for learning a silently changed tool from the consequences of one's own strokes."
readme = "README.md"
# Pinned: the golden page/image hashes and the historical replays were produced with CPython 3.12.
requires-python = ">=3.12,<3.13"
authors = [{ name = "Raghav Chaudhary" }]
# numpy and opencv are pinned exactly: rendered images (and so request-cache keys) are byte-identical only
# with these versions. Everything else is pinned in requirements.lock.
dependencies = [
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Only needed to replay/extend the historical direct-Gemini route (`flash-genai`); new runs use OpenRouter.
genai = ["google-genai>=2.0"]

[project.scripts]
freehand = "freehand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freehand = [
    "sim/assets/*.json",
    "agents/prompts/**/*.txt",
    "results/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "legacy: needs the historical source folders (skipped when absent)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E741",   # `l`/`I` names appear in ported numerical code
    "RUF001", # the prompts deliberately contain typographic characters (degree signs, dashes)
    "RUF002",
    "RUF003",
    "SIM108",
    "RUF005", # false positives on numpy arrays (`array + [dx, dy]` is addition, not concatenation)
    "RUF007",
    "RUF046", # int(round(x)) is needed: round() of a numpy float returns a numpy float
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/parity/record_legacy.py" = ["E501"]   # embeds the legacy-side worker script verbatim
